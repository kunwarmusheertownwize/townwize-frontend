events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Enable gzip compression
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/xml
    application/xhtml+xml
    application/rss+xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # --- Rate Limiting Zone (5 req/s burst 10 per IP for login) ---
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

  # --- Define custom log formats ---
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  log_format login_attempts 'LOGIN_ATTEMPT: $remote_addr - $remote_user [$time_local] "$request" '
                            '$status "$http_user_agent"';

  server {
    listen 8080;
    server_name _;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # --- Global Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # General access/error logs
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Allow manifest.json without auth, no cache
    location = /manifest.json {
      proxy_pass https://frontend-cd2u.onrender.com/manifest.json;
      proxy_ssl_server_name on;
      proxy_ssl_verify off;
      proxy_set_header Host frontend-cd2u.onrender.com;
      auth_basic off;
      add_header Cache-Control "no-cache";
    }

    # Cache static icons (1 year)
    location /icons/ {
      proxy_pass https://frontend-cd2u.onrender.com/icons/;
      proxy_ssl_server_name on;
      proxy_ssl_verify off;
      proxy_set_header Host frontend-cd2u.onrender.com;
      auth_basic off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache static assets (1 year, filenames are hashed by Vite)
    location /assets/ {
      proxy_pass https://frontend-cd2u.onrender.com/assets/;
      proxy_ssl_server_name on;
      proxy_ssl_verify off;
      proxy_set_header Host frontend-cd2u.onrender.com;
      auth_basic off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Default React app (index.html no cache)
    location / {
      proxy_pass https://frontend-cd2u.onrender.com;
      proxy_ssl_server_name on;
      proxy_ssl_verify off;
      proxy_set_header Host frontend-cd2u.onrender.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control "no-cache";
    }

    # Backend API (general, no rate limit)
    location /api/ {
      proxy_pass https://your-backend-service.onrender.com;

      # Forward headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # CORS headers
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

      # Handle preflight OPTIONS requests
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Max-Age' 86400;
        return 204;
      }
    }

    # --- Stricter Rate Limit for login/auth only ---
    location ~ ^/api/(auth|login) {
      proxy_pass https://your-backend-service.onrender.com;

      limit_req zone=login_limit burst=10 nodelay;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

      # Log login attempts separately
      access_log /var/log/nginx/login_attempts.log login_attempts;

      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Max-Age' 86400;
        return 204;
      }
    }
  }
}
