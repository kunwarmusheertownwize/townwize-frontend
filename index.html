<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <!-- ✅ Favicons -->
    <link rel="icon" href="/favicon-dark.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-dark.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-dark.png">

    <!-- ✅ Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120-dark.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152-dark.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">

    <!-- ✅ Android / Chrome / PWA -->
    <link rel="manifest" href="/site.webmanifest">

    <!-- ✅ Safari Pinned Tab -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#103139">
    <link rel="icon" type="image/png" sizes="512x512" href="/safari-pinned.png">


    <!-- ✅ Windows -->
    <meta name="msapplication-TileColor" content="#103139">
    <!-- meta[name="theme-color"] removed because it's not supported by Firefox / Firefox for Android / Opera -->

    <!-- ✅ iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Townwize">

    <!-- ✅ Viewport & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- App Title & Description -->
    <title>Townwize — On the move</title>
    <meta
      name="description"
      content="Book safe, reliable private and RideTogether rides in Bahria Town Karachi with Townwize."
    />

    <!-- SEO -->
    <meta
      name="keywords"
      content="Townwize, Bahria Town Karachi rides, BTK transport, RideTogether, private rides"
    />
    <meta name="author" content="Townwize" />
    <meta name="robots" content="index, follow">

    <!-- ✅ Social Sharing (OpenGraph) -->
    <!-- These must match what townwize.com publishes. They did not: the app
         carried an older title and, worse, a RELATIVE og:image.

         A relative og:image resolves against the page being shared, so this
         pointed at app.townwize.com/og-image.png — a different, older file that
         still carries the previous logo — while townwize.com served the current
         one. Sharing an app link therefore showed the old brand and sharing the
         landing page showed the new one.

         Absolute, and pointing at townwize.com rather than www.townwize.com:
         the www host 301s to the apex, and a scraper that does not follow
         redirects gets no image at all. One canonical file, not a copy per
         host, because a copy per host is exactly how these drifted apart.

         ⚠️ app.townwize.com/og-image.png STILL EXISTS on the deployed branch
         and is still the old logo. Nothing references it now; delete it when
         that branch is next touched. -->
    <meta property="og:title" content="TOWNWIZE — On the move – Verified Ride Hailing Platform for Bahria Town Karachi" />
    <!-- Matches townwize.com EXCEPT for its closing "Join the waitlist for
         early access". That belongs on the landing page and is wrong here: this
         is the app, and the links people are sent — a registration link, an
         invitation — go to somebody who is already past the waitlist. Telling
         them to join it reads as though we have lost track of them. -->
    <meta property="og:description" content="Townwize is Bahria Town Karachi's community-first ride platform. Every driver is a verified BTK resident. No strangers." />
    <meta property="og:image" content="https://townwize.com/og-image.png" />
    <meta property="og:type" content="website" />
    <!-- The app, not the marketing site. This said townwize.com, so a shared
         registration link advertised a different address than the one it
         opened. -->
    <meta property="og:url" content="https://app.townwize.com/" />
    <meta property="og:site_name" content="Townwize" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TOWNWIZE — On the move – Verified Ride Hailing Platform for Bahria Town Karachi">
    <meta name="twitter:description" content="Townwize is Bahria Town Karachi's community-first ride platform. Every driver is a verified BTK resident. No strangers.">
    <meta name="twitter:image" content="https://townwize.com/og-image.png">

    <!-- ✅ Compiled Tailwind CSS -->
    <link rel="stylesheet" href="/out.css" />
</head>

  <body class="bg-bgLight dark:bg-bgDark text-textPrimary">
    <div id="root"></div>

    <!--
      Startup error trap. A failure BEFORE React mounts — a module that throws on
      import, a syntax feature the browser does not support — leaves a blank white
      page with nothing to go on, and on a phone there are no devtools to open.
      This paints the actual error onto the page instead. It only ever renders
      when something has already gone wrong.
    -->
    <script>
      (function () {
        var shown = false;
        function show(title, detail) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          shown = true;
          root.innerHTML =
            '<div style="font:14px/1.5 system-ui,sans-serif;padding:24px;max-width:640px;margin:0 auto;color:#1a1a1a">' +
            '<h1 style="font-size:16px;margin:0 0 8px">Townwize could not start</h1>' +
            '<p style="margin:0 0 12px;color:#666">' + title + '</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#f4f4f5;padding:12px;' +
            'border-radius:8px;font-size:12px;margin:0">' + detail + '</pre></div>';
        }
        function esc(v) {
          return String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        window.addEventListener('error', function (e) {
          show('A script failed to load or run.',
               esc(e.message) + '\n' + esc(e.filename || '') + ':' + esc(e.lineno || ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('A startup task failed.', esc((r && (r.stack || r.message)) || r));
        });
        // Nothing threw, but nothing rendered either — the symptom that is
        // otherwise indistinguishable from a hang.
        setTimeout(function () {
          show('The app loaded but rendered nothing within 8 seconds.',
               'No error was reported. This usually means a module never finished loading.');
        }, 8000);
      })();
    </script>

    <!-- Main React Entry -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
